<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mothlight - carry the light to dawn</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
  /* The stage fills the window; the canvas keeps a 1280x800 world and is letterboxed inside it. */
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  /* Read aloud by a screen reader, never drawn: the same status the HUD shows. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="stage" width="1280" height="800" aria-label="Mothlight: steer the moth with the mouse, light every lantern before the bats catch you"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
